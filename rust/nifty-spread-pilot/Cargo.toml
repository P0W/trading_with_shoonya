[workspace]

[package]
name = "nifty-spread-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "cookies"] }
sha2 = "0.10"
zeroize = "1"
dotenvy = "0.15"
data-encoding = "2"
form_urlencoded = "1"
hmac = "0.12"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
csv = "1"
time = "0.3"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
